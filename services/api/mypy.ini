[mypy]
python_version = 3.11
strict = True
disallow_subclassing_any = False
disable_error_code = import-untyped
plugins = pydantic.mypy

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-qrcode.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-cv2]
ignore_missing_imports = True

[mypy-pypdf.*]
ignore_missing_imports = True
