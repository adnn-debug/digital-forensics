[project]
name = "ps05-api"
version = "0.1.0"
description = "PS-05 Digital Evidence Authenticity & Integrity Verification Platform API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<0.116.0",
    "uvicorn[standard]>=0.28.0,<0.33.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sqlalchemy>=2.0.28,<2.1.0",
    "alembic>=1.13.1,<1.14.0",
    "asyncpg>=0.29.0,<0.31.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "redis>=5.0.3,<5.3.0",
    "httpx>=0.27.0,<0.29.0",
    "python-multipart>=0.0.9,<0.0.20",
    "rq>=2.0.0,<3.0.0",
    "pillow>=10.0.0,<14.0.0",
    "opencv-python-headless>=4.8.0,<5.1.0",
    "numpy>=1.26.0,<3.0.0",
    "reportlab>=4.0.0",
    "qrcode>=7.4.0",
    "pypdf>=4.0.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "PT"]
ignore = ["B008", "E501", "N818", "A005"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017", "F841", "F401", "PT004", "PT011", "PT012", "E501"]
"tests/*" = ["B017", "F841", "F401", "PT004", "PT011", "PT012", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_subclassing_any = false
disable_error_code = ["import-untyped"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "reportlab.*",
    "qrcode.*",
    "scipy.*",
    "cv2.*",
    "cv2",
    "pypdf.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.reports.canvas"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
