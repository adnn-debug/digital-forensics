name: CI

on:
  pull_request:
    branches: [techx]
  push:
    branches: [techx, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration and required environment wiring
        env:
          POSTGRES_PASSWORD: ci-compose-only-password-please-discard
          SECRET_KEY: ci-compose-only-signing-key-please-discard-0123456789
        run: docker compose config --quiet

  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        env:
          ENVIRONMENT: testing
          DEBUG: "false"
          SECRET_KEY: ci-only-not-a-production-secret
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/15
        run: python -m pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend lint, types, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
