version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: ps05_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensic_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}
      POSTGRES_DB: ${POSTGRES_DB:-ps05_evidence_db}
    # Keep database private to the Compose network. Use docker compose exec db psql ... for local administration.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensic_admin} -d ${POSTGRES_DB:-ps05_evidence_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ps05_network

  redis:
    image: redis:7-alpine
    container_name: ps05_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Keep Redis private to the Compose network; do not publish its unauthenticated port.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ps05_network

  migrate:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: ps05_migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-forensic_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}@db:5432/${POSTGRES_DB:-ps05_evidence_db}
    volumes:
      - ./services/api:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ps05_network

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: ps05_api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-forensic_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}@db:5432/${POSTGRES_DB:-ps05_evidence_db}
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BASE_PATH=/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    volumes:
      - ./services/api:/app
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - ps05_network

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: ps05_worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-forensic_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}@db:5432/${POSTGRES_DB:-ps05_evidence_db}
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BASE_PATH=/app/storage
    volumes:
      - ./services/api:/app
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - ps05_network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://api:8000
    container_name: ps05_web
    restart: unless-stopped
    # Source and .next are bind-mounted for development, so run Next.js in dev mode.
    command: ["npm", "run", "dev"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - INTERNAL_API_URL=http://api:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ps05_network

volumes:
  postgres_data:
  redis_data:

networks:
  ps05_network:
    driver: bridge
